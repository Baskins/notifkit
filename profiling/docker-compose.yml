      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-0}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10000000}
      SERVICES: ${MONOLITH_SERVICES:-api,enricher,engine,delivery,scheduler}
    ports:
      - "35678:3000"
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: "${SERVER_CPUS:-1.0}"
          memory: "${SERVER_MEMORY:-1G}"

  # API Ingress Node 1
  api-server-1:
